[project]
name = "cyfouri-data-explorer"
version = "0.1.0"
description = "Exploratory data analysis with statistical depth, in Python: the engine of Data Explorer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cyril Kfouri" }]
dependencies = [
    "duckdb>=1.5.6",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "pydantic>=2.14",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
# Boosting models and hyper-parameter tuning (019, 021).
ml = [
    "cmaes>=0.13.1",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "xgboost>=3 ; sys_platform != 'linux'",
    "xgboost-cpu>=3 ; sys_platform == 'linux'",
]
# Deep synthetic-data models (023b: CTGAN, TVAE, TimeGAN).
deep = ["torch>=2.14"]
# The app's charts as interactive figures (dx.plot).
plot = ["plotly>=6"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# PyTorch: built for CUDA 13.0 on Windows (driver >= 580), CPU-only on Linux (CI, small), the
# default wheels on macOS (Apple GPU through MPS). Same choice as the app.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyfouri_data_explorer"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The README's examples keep their aligned comments.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Statistical notation (×, ρ, η², en dashes) is intended in these messages.
"src/cyfouri_data_explorer/compare/*" = ["RUF001", "RUF003"]
"src/cyfouri_data_explorer/correlations/*" = ["RUF001", "RUF003"]
"src/cyfouri_data_explorer/report/*" = ["RUF001", "RUF002", "RUF003"]
"src/cyfouri_data_explorer/dataset.py" = ["RUF001", "RUF002", "RUF003"]
"src/cyfouri_data_explorer/timeseries/facade.py" = ["RUF002"]
# Chart labels and hover texts use the app's symbols (×, −, σ, ρ, η, ≤).
"src/cyfouri_data_explorer/plots/*" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance checks on millions of rows (run with -m slow)"]
addopts = "-m 'not slow'"
