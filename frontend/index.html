<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Data Explorer</title>
    <script>
      // Apply saved theme and density before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem("de.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        var density = localStorage.getItem("de.density");
        if (density === "comfortable") document.documentElement.dataset.density = density;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
