[project]
name = "data-explorer"
version = "0.1.0"
description = "Local, offline exploratory data analysis with statistical depth."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Statistical notation (×, ρ, η², en dashes) is intended in these messages.
"app/domain/compare/*" = ["RUF001", "RUF003"]
"app/domain/correlations/*" = ["RUF001", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance checks on millions of rows (run with -m slow)"]
addopts = "-m 'not slow'"
